name: Publish DynamicDataCore Packages

on:
  push:
    tags:
      - 'v*.*.*'   # Ej: v1.0.2

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        project:
          - name: DynamicDataCore.Abstractions
            path: src/DynamicDataCore.Abstractions
          - name: DynamicDataCore.Common
            path: src/DynamicDataCore.Common
          - name: DynamicDataCore.Infraestructure
            path: src/DynamicDataCore.Infraestructure

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ${{ matrix.project.path }}

      - name: Build
        run: dotnet build ${{ matrix.project.path }} -c Release --no-restore

      - name: Pack
        run: dotnet pack ${{ matrix.project.path }} -c Release --no-build -o ./artifacts

      - name: Add GitHub Packages NuGet source
        run: |
          dotnet nuget remove source github || true
          dotnet nuget add source \
            "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --name github \
            --username ${{ github.repository_owner }} \
            --password ${{ secrets.GITHUB_TOKEN }} \
            --store-password-in-clear-text
      
      - name: Publish to GitHub Packages
        run: |
          for package in ./artifacts/*.nupkg; do
            dotnet nuget push "$package" \
              --source github \
              --skip-duplicate
          done
