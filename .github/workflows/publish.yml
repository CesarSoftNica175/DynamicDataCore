name: Publish DynamicDataCore Packages

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write
  id-token: write   # Trusted Publishing de nuget.org (OIDC), sin API key

jobs:
  publish:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        project:
          - name: DynamicDataCore.Abstractions
            path: src/DynamicDataCore.Abstractions
          - name: DynamicDataCore.Common
            path: src/DynamicDataCore.Common
          - name: DynamicDataCore.Infrastructure
            path: src/DynamicDataCore.Infrastructure

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore ${{ matrix.project.path }}

      - name: Build
        run: dotnet build ${{ matrix.project.path }} -c Release --no-restore

      - name: Pack
        run: dotnet pack ${{ matrix.project.path }} -c Release --no-build -o ./artifacts

      - name: Verify no AI guide files in package
        run: |
          for pkg in ./artifacts/*.nupkg; do
            echo "Checking $pkg for AI files..."
            if unzip -l "$pkg" | grep -iE 'claude|agents|copilot|\.ai' > /dev/null 2>&1; then
              echo "ERROR: AI guide file found in $pkg — aborting publish."
              exit 1
            fi
          done
          echo "Package clean — no AI files found."

      - name: Publish to GitHub Packages
        run: |
          for package in ./artifacts/*.nupkg; do
            dotnet nuget push "$package"               --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"               --api-key "${{ secrets.GITHUB_TOKEN }}"               --skip-duplicate
          done

      # nuget.org via Trusted Publishing (OIDC, sin API key). Opt-in: crear la variable de repo NUGET_PUBLISH=true
      # DESPUES de registrar la politica en nuget.org (Trusted Publishing: owner, repo, workflow publish.yml).
      - name: NuGet login (Trusted Publishing)
        if: ${{ vars.NUGET_PUBLISH == 'true' }}
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: CesarSoftNica

      - name: Publish to nuget.org
        if: ${{ vars.NUGET_PUBLISH == 'true' }}
        run: |
          for package in ./artifacts/*.nupkg; do
            dotnet nuget push "$package"               --source https://api.nuget.org/v3/index.json               --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"               --skip-duplicate
          done
