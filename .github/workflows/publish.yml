name: Publish DynamicDataCore Packages (nuget.org)

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        project:
          - name: DynamicDataCore.Abstractions
            path: src/DynamicDataCore.Abstractions
          - name: DynamicDataCore.Common
            path: src/DynamicDataCore.Common
          - name: DynamicDataCore.Infrastructure
            path: src/DynamicDataCore.Infrastructure

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore ${{ matrix.project.path }}

      - name: Build
        run: dotnet build ${{ matrix.project.path }} -c Release --no-restore

      - name: Pack
        run: dotnet pack ${{ matrix.project.path }} -c Release --no-build -o ./artifacts

      - name: Verify no AI guide files in package
        run: |
          for pkg in ./artifacts/*.nupkg; do
            echo "Checking $pkg for AI files..."
            if unzip -l "$pkg" | grep -iE 'claude|agents|copilot|\.ai' > /dev/null 2>&1; then
              echo "ERROR: AI guide file found in $pkg — aborting publish."
              exit 1
            fi
          done
          echo "Package clean — no AI files found."

      - name: Publish to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "ERROR: falta el secreto NUGET_API_KEY (API key de nuget.org con alcance solo a los 3 paquetes y fecha de expiracion)."
            exit 1
          fi
          for package in ./artifacts/*.nupkg; do
            dotnet nuget push "$package" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "$NUGET_API_KEY" \
              --skip-duplicate
          done
